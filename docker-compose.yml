# VYRON local composition. Ports are bound to 127.0.0.1 so nothing is exposed on your network.
#
#   docker compose up -d                      data stores only (postgres, neo4j, redis)
#   docker compose --profile seed up --build  the seed-backed development API on http://127.0.0.1:8000
#   docker compose --profile app up --build   the full stack (UNVERIFIED, see the notes on api and web)
#
# STATUS: UNVERIFIED. The file is validated with `docker compose config` (no daemon needed). No image
# was built and no container was started because the Docker daemon was not available.
name: vyron

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vyron}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vyron}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      # Password is substituted by compose (the container only receives NEO4J_AUTH). Local dev only.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p '${NEO4J_PASSWORD}' 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- application services (not started by default) -------------------------------------------------

  # The development API over the in-memory seed. Standard library only; no database needed.
  # DEVELOPMENT ONLY: single process, seed data, in-memory rate limits.
  api-seed:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: seed-dev
    image: vyron-api:seed-dev
    restart: unless-stopped
    environment:
      APP_ENV: development
      DATA_MODE: seed
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m

  # The FastAPI application. UNVERIFIED: its dependencies could not be installed, and with
  # DATA_MODE=database it exits at start-up with AdapterNotImplementedError because the PostgreSQL,
  # Neo4j and Redis adapters are not written. It is listed so the intended wiring is reviewable.
  # SESSION_SECRET is not required here so that `docker compose up postgres` works without it; the
  # application itself refuses to start in production without a secret of at least 32 characters.
  # Do not enable both the seed and app profiles: api and api-seed publish the same port.
  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    image: vyron-api:runtime
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATA_MODE: database
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      DATABASE_URL: postgresql://${POSTGRES_USER:-vyron}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vyron}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_SECRET_PREVIOUS: ${SESSION_SECRET_PREVIOUS:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m

  # The Next.js application. UNVERIFIED TEMPLATE: apps/web has no Next.js app yet, so this cannot build.
  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: vyron-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m

volumes:
  postgres-data:
  neo4j-data:
  redis-data:
