<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0e14" />
    <meta name="robots" content="index, follow" />
    <meta name="description" content="Read any public GitHub repository live through VYRON: stars, forks, license, language shares, top contributors, latest release, and 52-week commit activity with exact API source URLs." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VYRON" />
    <meta property="og:title" content="VYRON — Live GitHub Repository Analysis" />
    <meta property="og:description" content="Inspect a public GitHub repository live with provenance, cache freshness, language breakdown, contributors, latest release, and weekly commit activity." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="VYRON — Live GitHub Repository Analysis" />
    <meta name="twitter:description" content="Live public GitHub repository reading with exact API source URLs and JSON evidence export." />
    <title>VYRON repository reading</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="alternate" type="application/ld+json" href="/schema.jsonld" />
    <link rel="alternate" type="text/plain" href="/llms.txt" title="LLM and Answer Engine summary" />
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/prototype.css" />
    <script type="module" src="/js/apps/web/prototype/src/repository.js"></script>
  </head>
  <body>
    <a class="skip" href="#reading">Skip to the reading</a>

    <header class="bar">
      <a class="brand" href="/" aria-label="VYRON, back to the map">
        <span id="brand-mark" aria-hidden="true"></span>
        <span class="wordmark">VYRON</span>
      </a>
      <a class="page-link" href="/">Map</a>
      <span class="page-link page-current" aria-current="page">Repository</span>
      <a class="page-link" href="/dependencies.html">Dependencies</a>
      <a class="page-link" href="/compare.html">Compare</a>

      <form class="repo-form" id="repo-form" autocomplete="off">
        <label class="sr-only" for="repo-input">GitHub repository</label>
        <input
          id="repo-input"
          name="repo"
          type="text"
          placeholder="owner/name or a GitHub link"
          maxlength="300"
          spellcheck="false"
          autocapitalize="off"
          autocomplete="off"
          enterkeyhint="go"
        />
        <button type="submit" class="primary" id="repo-submit">Analyze</button>
      </form>
    </header>

    <main class="repo-main" id="repo-main">
      <section class="repo-reading" id="reading" aria-label="Repository reading" tabindex="-1"></section>
    </main>

    <footer class="status">
      <p id="quota" role="status"></p>
      <p id="repo-notice">Figures are read from the GitHub REST API when you ask. Nothing is stored.</p>
    </footer>

    <p class="sr-only" id="live" role="status" aria-live="polite"></p>
    <noscript><p class="noscript">VYRON needs JavaScript to read a repository, because the page asks the API for it.</p></noscript>
  </body>
</html>
